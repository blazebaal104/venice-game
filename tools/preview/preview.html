<!DOCTYPE html>
<html><body style="margin:0;background:#000">
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Mirrors GameRenderer.onDrawFrame with the exact same shaders and lighting constants.
const P = new URLSearchParams(location.search);
const bx = +P.get('x'), by = +P.get('y'), bh = +P.get('h') * Math.PI / 180;
const camMode = P.get('cam') || 'chase';
const gl = document.getElementById('c').getContext('webgl2', {antialias: true});
async function txt(u) { return (await fetch(u)).text(); }
async function bin(u) { const r = await fetch(u); if (!r.ok) return null; return await r.arrayBuffer(); }
function prog(vs, fs) {
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(sh); return sh; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  p.u = n => gl.getUniformLocation(p, n); return p;
}
function mesh(f32, stride, layout) {
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, f32, gl.STATIC_DRAW);
  let off = 0; layout.forEach((n, i) => { gl.enableVertexAttribArray(i); gl.vertexAttribPointer(i, n, gl.FLOAT, false, stride * 4, off * 4); off += n; });
  return {vao, n: f32.length / stride};
}
function draw(m) { if (!m || !m.n) return; gl.bindVertexArray(m.vao); gl.drawArrays(gl.TRIANGLES, 0, m.n); }
function tex(w, h, fmt, ifmt, data, lin) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, gl.UNSIGNED_BYTE, data);
  const f = lin ? gl.LINEAR : gl.NEAREST; gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t;
}
// --- Mat4 (column-major), same as core/Mat4.kt
const M = {
  mul(a, b) { const r = new Float32Array(16); for (let c = 0; c < 4; c++) for (let rr = 0; rr < 4; rr++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k*4+rr] * b[c*4+k]; r[c*4+rr] = s; } return r; },
  persp(f, a, n, fa) { const t = 1 / Math.tan(f / 2), m = new Float32Array(16); m[0] = t / a; m[5] = t; m[10] = (fa + n) / (n - fa); m[11] = -1; m[14] = 2 * fa * n / (n - fa); return m; },
  look(e, c, u) { let f = [c[0]-e[0], c[1]-e[1], c[2]-e[2]]; let l = Math.hypot(...f); f = f.map(x => x / l);
    let s = [f[1]*u[2]-f[2]*u[1], f[2]*u[0]-f[0]*u[2], f[0]*u[1]-f[1]*u[0]]; l = Math.hypot(...s); s = s.map(x => x / l);
    const v = [s[1]*f[2]-s[2]*f[1], s[2]*f[0]-s[0]*f[2], s[0]*f[1]-s[1]*f[0]]; const m = new Float32Array(16);
    m[0]=s[0]; m[4]=s[1]; m[8]=s[2]; m[1]=v[0]; m[5]=v[1]; m[9]=v[2]; m[2]=-f[0]; m[6]=-f[1]; m[10]=-f[2];
    m[12]=-(s[0]*e[0]+s[1]*e[1]+s[2]*e[2]); m[13]=-(v[0]*e[0]+v[1]*e[1]+v[2]*e[2]); m[14]=f[0]*e[0]+f[1]*e[1]+f[2]*e[2]; m[15]=1; return m; },
  T(x, y, z) { const m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; m[12]=x; m[13]=y; m[14]=z; return m; },
  ortho(l,r,b,t,n,f){const m=M.T(0,0,0);m[0]=2/(r-l);m[5]=2/(t-b);m[10]=-2/(f-n);m[12]=-(r+l)/(r-l);m[13]=-(t+b)/(t-b);m[14]=-(f+n)/(f-n);return m;},
  Rz(a) { const m = M.T(0,0,0), c = Math.cos(a), s = Math.sin(a); m[0]=c; m[1]=s; m[4]=-s; m[5]=c; return m; },
  inv(m) { // gl-matrix style inverse
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
    const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; det=1/det; const o=new Float32Array(16);
    o[0]=(a11*b11-a12*b10+a13*b09)*det;o[1]=(a02*b10-a01*b11-a03*b09)*det;o[2]=(a31*b05-a32*b04+a33*b03)*det;o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det;o[5]=(a00*b11-a02*b08+a03*b07)*det;o[6]=(a32*b02-a30*b05-a33*b01)*det;o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det;o[9]=(a01*b08-a00*b10-a03*b06)*det;o[10]=(a30*b04-a31*b02+a33*b00)*det;o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det;o[13]=(a00*b09-a01*b07+a02*b06)*det;o[14]=(a31*b01-a30*b03-a32*b00)*det;o[15]=(a20*b03-a21*b01+a22*b00)*det; return o; }
};
(async () => {
  try {
  const S = {}; for (const n of ['generic','facade','ground','water','sky','depth']) S[n] = prog(await txt(`sh/${n}.vs`), await txt(`sh/${n}.fs`));
  const info = JSON.parse(await txt('exp/tiles.json'));
  const tiles = [];
  for (const t of info.tiles) {
    const T = {ox: t.ox, oy: t.oy, marsh: t.marsh};
    T.f = mesh(new Float32Array(await bin(`exp/f_${t.id}.bin`)), 12, [3,3,2,4]);
    T.g = mesh(new Float32Array(await bin(`exp/g_${t.id}.bin`)), 12, [3,3,2,4]);
    if (t.mask) { T.mask = tex(258, 258, gl.RG, gl.RG8, new Uint8Array(await bin(`exp/m_${t.id}.bin`)), true); T.cls = tex(258, 258, gl.RED, gl.R8, new Uint8Array(await bin(`exp/c_${t.id}.bin`)), false); }
    tiles.push(T);
  }
  const boat = mesh(new Float32Array(await bin('exp/boat.bin')), 12, [3,3,2,4]);
  const quad = mesh(new Float32Array([0,0,0,256,0,0,256,256,0,0,0,0,256,256,0,0,256,0]), 3, [3]);
  const sky = mesh(new Float32Array([-1,-1,3,-1,-1,3]), 2, [2]);
  const wd = []; const n = 90, size = 3200, st = size / n;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const x0 = -size/2 + i*st, y0 = -size/2 + j*st, x1 = x0 + st, y1 = y0 + st; wd.push(x0,y0,0,x1,y0,0,x1,y1,0,x0,y0,0,x1,y1,0,x0,y1,0); }
  const water = mesh(new Float32Array(wd), 3, [3]);
  // constants from GameRenderer
  const az = 225 * Math.PI / 180, el = 36 * Math.PI / 180;
  const sunDir = [Math.sin(az)*Math.cos(el), Math.cos(az)*Math.cos(el), Math.sin(el)];
  const sunCol = [1.18,1.06,0.90], skyAmb = [0.40,0.46,0.56], groundAmb = [0.30,0.27,0.22], fogCol = [0.80,0.84,0.88], zenith = [0.33,0.52,0.80];
  let cam;
  if (camMode === 'chase') { const d = 8.5, pitch = 0.22; cam = [bx - Math.cos(bh)*d*Math.cos(pitch), by - Math.sin(bh)*d*Math.cos(pitch), 1.4 + d*Math.sin(pitch)]; }
  else cam = P.get('cam').split(',').map(Number);
  const tgt = camMode === 'chase' ? [bx + Math.cos(bh)*2.5, by + Math.sin(bh)*2.5, 1.1] : P.get('tgt').split(',').map(Number);
  const vp = M.mul(M.persp(62 * Math.PI / 180, 1280/720, 0.35, 2600), M.look(cam, tgt, [0,0,1]));
  const time = 3.0;
  // shadow map
  const SH = 2048; const stex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, stex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, SH, SH, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, stex, 0); gl.drawBuffers([gl.NONE]);
  const yaw = bh; const scx = cam[0] + Math.cos(yaw)*150, scy = cam[1] + Math.sin(yaw)*150; const half = 210, texel = half*2/SH;
  const sx = Math.floor(scx/texel)*texel, sy = Math.floor(scy/texel)*texel, dist = 400;
  const lightVP = M.mul(M.ortho(-half, half, -half, half, 1, dist*2), M.look([sx+sunDir[0]*dist, sy+sunDir[1]*dist, sunDir[2]*dist], [sx, sy, 0], [0,0,1]));
  gl.viewport(0, 0, SH, SH); gl.enable(gl.DEPTH_TEST); gl.clear(gl.DEPTH_BUFFER_BIT); gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.6, 2.5);
  gl.useProgram(S.depth); gl.uniformMatrix4fv(S.depth.u('uLightVP'), false, lightVP);
  for (const t of tiles) { gl.uniformMatrix4fv(S.depth.u('uModel'), false, M.T(t.ox, t.oy, 0)); draw(t.f); draw(t.g); }
  const boatM = M.mul(M.mul(M.T(bx, by, 0.05), M.Rz(bh)), M.T(-2.22, 0, 0));
  gl.uniformMatrix4fv(S.depth.u('uModel'), false, boatM); draw(boat);
  gl.disable(gl.POLYGON_OFFSET_FILL); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  function common(p) { gl.useProgram(p); gl.uniformMatrix4fv(p.u('uVP'), false, vp); gl.uniform3fv(p.u('uSunDir'), sunDir); gl.uniform3fv(p.u('uSunCol'), sunCol); gl.uniform3fv(p.u('uSkyAmb'), skyAmb); gl.uniform3fv(p.u('uGroundAmb'), groundAmb); gl.uniform3fv(p.u('uFogCol'), fogCol); gl.uniform1f(p.u('uFogDens'), 1/950); gl.uniform3fv(p.u('uCam'), cam); gl.uniform1f(p.u('uTime'), time);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, stex); gl.uniform1i(p.u('uShadow'), 2); gl.uniformMatrix4fv(p.u('uLightVP'), false, lightVP); gl.uniform1f(p.u('uShadowOn'), 1); }
  gl.viewport(0, 0, 1280, 720); gl.enable(gl.DEPTH_TEST); gl.clearColor(...fogCol, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.depthMask(false); gl.useProgram(S.sky); gl.uniformMatrix4fv(S.sky.u('uInvVP'), false, M.inv(vp)); gl.uniform3fv(S.sky.u('uSunDir'), sunDir); gl.uniform3fv(S.sky.u('uFogCol'), fogCol); gl.uniform3fv(S.sky.u('uSkyZenith'), zenith); gl.uniform3fv(S.sky.u('uSunCol'), sunCol); draw(sky); gl.depthMask(true);
  common(S.ground); gl.uniform1i(S.ground.u('uMask'), 0); gl.uniform1i(S.ground.u('uClass'), 1);
  for (const t of tiles) { if (!t.mask) continue; gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, t.mask); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, t.cls);
    gl.uniform1f(S.ground.u('uMarshPass'), 0); gl.uniformMatrix4fv(S.ground.u('uModel'), false, M.T(t.ox, t.oy, 1.1)); draw(quad);
    if (t.marsh) { gl.uniform1f(S.ground.u('uMarshPass'), 1); gl.uniformMatrix4fv(S.ground.u('uModel'), false, M.T(t.ox, t.oy, 0.32)); draw(quad); } }
  common(S.facade); for (const t of tiles) { gl.uniformMatrix4fv(S.facade.u('uModel'), false, M.T(t.ox, t.oy, 0)); draw(t.f); }
  common(S.generic); for (const t of tiles) { gl.uniformMatrix4fv(S.generic.u('uModel'), false, M.T(t.ox, t.oy, 0)); draw(t.g); }
  gl.uniformMatrix4fv(S.generic.u('uModel'), false, boatM); draw(boat);
  common(S.water); gl.uniform3fv(S.water.u('uCenter'), [Math.floor(cam[0]/40)*40, Math.floor(cam[1]/40)*40, 0]); gl.uniform3fv(S.water.u('uSkyZenith'), zenith); draw(water);
  document.title = 'DONE';
  } catch (e) { document.title = 'ERR ' + e; }
})();
</script></body></html>
